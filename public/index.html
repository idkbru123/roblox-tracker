<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Personal Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2e; color: #cdd6f4; display: flex; min-height: 100vh; }

    /* SIDEBAR NAVIGATION */
    .sidebar { width: 250px; background: #181825; border-right: 1px solid #313244; position: fixed; height: 100vh; top: 0; left: 0; display: flex; flex-direction: column; justify-content: space-between; z-index: 100; }
    .sidebar-top { flex: 1; }
    .sidebar .brand { padding: 22px 16px; font-size: 1.1rem; font-weight: bold; color: #89b4fa; text-align: center; border-bottom: 1px solid #313244; }
    .sidebar .menu { list-style: none; margin-top: 15px; }
    .sidebar .menu-btn { width: 100%; padding: 14px 20px; background: transparent; border: none; color: #a6adc8; font-size: 0.95rem; font-weight: 600; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s ease; }
    .sidebar .menu-btn:hover { background: #313244; color: #cdd6f4; }
    .sidebar .menu-btn.active { background: #313244; color: #89b4fa; border-left: 4px solid #89b4fa; }

    /* USER AUTH PROFILE BOX */
    .user-profile-box { padding: 15px; border-top: 1px solid #313244; background: #11111b; text-align: center; }
    .btn-discord { background: #5865F2; color: #fff; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-discord:hover { background: #4752C4; }
    .btn-logout { background: #f38ba8; color: #11111b; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 0.8rem; }
    .discord-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #5865F2; }

    /* MAIN CONTENT AREA */
    .main-content { margin-left: 250px; flex: 1; padding: 25px; width: calc(100% - 250px); max-width: 1000px; }
    .tab-section { display: none; }
    .tab-section.active { display: block; }

    h1 { color: #89b4fa; margin-bottom: 20px; font-size: 1.6rem; border-bottom: 1px solid #313244; padding-bottom: 10px; }

    /* FILTER BOX STYLES */
    .filter-box { margin-bottom: 20px; display: flex; align-items: center; gap: 12px; background: #181825; padding: 12px 18px; border-radius: 8px; border: 1px solid #313244; }
    .filter-box label { color: #a6adc8; font-size: 0.95rem; font-weight: 600; }
    .filter-box select { background: #313244; color: #cdd6f4; border: 1px solid #45475a; padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; outline: none; cursor: pointer; }

    /* CARD STYLES */
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .log-card { background: #313244; padding: 15px 20px; margin-bottom: 12px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 8px; }
    .log-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #45475a; padding-bottom: 8px; }
    
    /* BADGES */
    .status-badge { padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.85em; }
    .status-1 { background: #a6e3a1; color: #11111b; }
    .status-0 { background: #f38ba8; color: #11111b; }
    .status-other { background: #89b4fa; color: #11111b; }

    .log-info { font-size: 0.95em; color: #bac2de; }
    .highlight { color: #f9e2af; font-weight: bold; }
    .sub-id { font-size: 0.8em; color: #a6adc8; margin-left: 6px; }
    .timestamp { font-size: 0.85em; color: #a6adc8; text-align: right; }
    .empty-msg { text-align: center; color: #a6adc8; padding: 30px; background: #181825; border-radius: 8px; border: 1px dashed #313244; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- MENU BÊN TRÁI -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="brand">🎮 ROBLOX TRACKER</div>
      <ul class="menu">
        <li>
          <button class="menu-btn active" onclick="showTab('live', this)">
            🔴 1. Roblox Live
          </button>
        </li>
        <li>
          <button class="menu-btn" onclick="showTab('history', this)">
            📜 2. Xem lịch sử hoạt động
          </button>
        </li>
      </ul>
    </div>

    <div class="user-profile-box" id="authBox">
      <button class="btn-discord" onclick="loginWithDiscord()">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M13.545 2.907a13.227 13.227 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.19 12.19 0 0 0-3.658 0 8.258 8.258 0 0 0-.412-.833.051.051 0 0 0-.052-.025-1.125.194-2.22.534-3.257 1.011a.041.041 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032c.001.014.01.028.021.037a13.276 13.276 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019c.308-.42.582-.863.818-1.329a.05.05 0 0 0-.01-.059.051.051 0 0 0-.018-.011 8.875 8.875 0 0 1-1.248-.595.05.05 0 0 1-.02-.066.051.051 0 0 1 .015-.019c.084-.063.168-.129.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.05.05 0 0 1 .052.007c.08.066.164.132.248.195a.051.051 0 0 1-.004.085 8.254 8.254 0 0 1-1.249.594.05.05 0 0 0-.027.07.05.05 0 0 0 .01.011c.236.466.51.91.819 1.329a.05.05 0 0 0 .056.019 13.235 13.235 0 0 0 4.001-2.02.049.049 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.034.034 0 0 0-.02-.019Zm-8.198 7.307c-.789 0-1.438-.724-1.438-1.612 0-.889.637-1.613 1.438-1.613.807 0 1.45.73 1.438 1.613 0 .888-.637 1.612-1.438 1.612Zm5.316 0c-.788 0-1.438-.724-1.438-1.612 0-.889.637-1.613 1.438-1.613.807 0 1.451.73 1.438 1.613 0 .888-.631 1.612-1.438 1.612Z"/></svg>
        Đăng nhập Discord
      </button>
    </div>
  </div>

  <div class="main-content">
    
    <!-- TAB 1: ROBLOX LIVE -->
    <div id="tab-live" class="tab-section active">
      <h1>🔴 Trạng Thái Trực Tiếp (Cá Nhân)</h1>
      <div id="live-container" class="grid-container">
        <p class='empty-msg'>Vui lòng đăng nhập bằng tài khoản Discord của bạn để xem trạng thái.</p>
      </div>
    </div>

    <!-- TAB 2: LỊCH SỬ HOẠT ĐỘNG -->
    <div id="tab-history" class="tab-section">
      <h1>📜 Lịch Sử Hoạt Động (Cá Nhân)</h1>
      
      <div class="filter-box" id="filterBox" style="display: none;">
        <label for="userFilter">👤 Tài khoản của bạn:</label>
        <select id="userFilter" onchange="renderHistoryLogs()">
          <option value="ALL">✨ Tất cả tài khoản đã liên kết của tôi</option>
        </select>
      </div>

      <div id="logs">
        <p class='empty-msg'>Vui lòng đăng nhập bằng tài khoản Discord của bạn để xem lịch sử.</p>
      </div>
    </div>

  </div>

  <script>
    const DISCORD_CLIENT_ID = "1531721453664469153"; 
    const REDIRECT_URI = window.location.origin + window.location.pathname;

    const firebaseConfig = {
      apiKey: "AIzaSyBYZE99y7JcqBXDQh7wHxFPdI0GVCCc_XE",
      authDomain: "roblox-logs-406cd.firebaseapp.com",
      projectId: "roblox-logs-406cd",
      storageBucket: "roblox-logs-406cd.firebasestorage.app",
      messagingSenderId: "678655678400",
      appId: "1:678655678400:web:8e99a81d2b2e23ec355a25",
      measurementId: "G-H7BS9DHD4C"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const usernameCache = {};
    let currentUserDiscord = null;
    let userLinkedRobloxIds = [];
    let rawLogsData = [];

    function showTab(tabName, btn) {
      document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.menu-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      btn.classList.add('active');
    }

    function isValidRobloxId(id) {
      if (!id) return false;
      const str = String(id).trim();
      return /^\d{5,14}$/.test(str);
    }

    async function fetchRobloxUsername(userId) {
      if (!isValidRobloxId(userId)) return `ID: ${userId}`;
      if (usernameCache[userId]) return usernameCache[userId];

      try {
        const targetUrl = `https://users.roblox.com/v1/users/${userId}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        const res = await fetch(proxyUrl);
        if (res.ok) {
          const data = await res.json();
          const name = data.displayName || data.name;
          if (name) {
            usernameCache[userId] = name;
            return name;
          }
        }
      } catch (e) {
        console.warn("Lỗi lấy tên Roblox:", userId);
      }
      return `ID: ${userId}`;
    }

    function loginWithDiscord() {
      const url = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify%20connections`;
      window.location.href = url;
    }

    function checkDiscordAuth() {
      const hash = window.location.hash;
      let token = localStorage.getItem("discord_token");

      if (hash.includes("access_token=")) {
        token = new URLSearchParams(hash.substring(1)).get("access_token");
        localStorage.setItem("discord_token", token);
        history.replaceState(null, "", window.location.pathname);
      }

      if (token) {
        fetch("https://discord.com/api/users/@me", {
          headers: { Authorization: `Bearer ${token}` }
        })
        .then(res => {
          if (!res.ok) throw new Error("Token expired");
          return res.json();
        })
        .then(async (user) => {
          if (user.id) {
            currentUserDiscord = user;
            updateAuthUI();
            
            await autoSyncDiscordRobloxConnection(token, user.id);
            loadUserPrivateData();
          } else {
            logout();
          }
        })
        .catch(() => logout());
      }
    }

    async function autoSyncDiscordRobloxConnection(token, discordId) {
      try {
        const res = await fetch("https://discord.com/api/users/@me/connections", {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) {
          const connections = await res.json();
          const robloxConns = connections.filter(c => c.type === 'roblox');
          
          if (robloxConns.length > 0) {
            const robloxIdsToSync = robloxConns.map(c => String(c.id));
            const robloxAccountsToSync = robloxConns.map(c => ({
              robloxId: String(c.id),
              robloxUsername: String(c.name || "")
            }));
            
            await db.collection("user_links").doc(String(discordId)).set({
              discordId: String(discordId),
              robloxIds: firebase.firestore.FieldValue.arrayUnion(...robloxIdsToSync),
              robloxAccounts: firebase.firestore.FieldValue.arrayUnion(...robloxAccountsToSync)
            }, { merge: true });
          }
        }
      } catch (e) {
        console.warn("Không thể tự đồng bộ Discord Connections:", e);
      }
    }

    function logout() {
      localStorage.removeItem("discord_token");
      window.location.reload();
    }

    function updateAuthUI() {
      const authBox = document.getElementById("authBox");
      if (currentUserDiscord) {
        const avatarUrl = currentUserDiscord.avatar 
          ? `https://cdn.discordapp.com/avatars/${currentUserDiscord.id}/${currentUserDiscord.avatar}.png`
          : `https://cdn.discordapp.com/embed/avatars/0.png`;

        authBox.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px; justify-content:center; text-align:left;">
            <img src="${avatarUrl}" class="discord-avatar">
            <div>
              <div style="font-weight:bold; color:#fff; font-size:0.9rem;">${currentUserDiscord.username}</div>
              <div style="font-size:0.75rem; color:#a6adc8;">Đã đăng nhập bảo mật</div>
            </div>
          </div>
          <button class="btn-logout" onclick="logout()">Đăng xuất</button>
        `;
      }
    }

    async function loadUserPrivateData() {
      if (!currentUserDiscord) return;

      const currentDiscordId = String(currentUserDiscord.id);
      let foundIds = new Set();

      try {
        const directDoc = await db.collection("user_links").doc(currentDiscordId).get();
        if (directDoc.exists) {
          const data = directDoc.data();

          if (data.robloxAccounts && Array.isArray(data.robloxAccounts)) {
            data.robloxAccounts.forEach(acc => {
              const rId = typeof acc === 'object' ? acc.robloxId : acc;
              if (rId && isValidRobloxId(rId)) {
                foundIds.add(String(rId));
                if (typeof acc === 'object' && acc.robloxUsername) {
                  usernameCache[String(rId)] = acc.robloxUsername;
                }
              }
            });
          }

          if (data.robloxIds && Array.isArray(data.robloxIds)) {
            data.robloxIds.forEach(id => {
              if (id && isValidRobloxId(id)) {
                foundIds.add(String(id));
              }
            });
          }
        }

        const logsSnap = await db.collection("roblox_logs").where("discordId", "==", currentDiscordId).get();
        logsSnap.forEach(doc => {
          const data = doc.data();
          const rId = String(data.robloxUserId || data.robloxId || "");
          if (isValidRobloxId(rId)) {
            foundIds.add(rId);
          }
        });

      } catch (err) {
        console.warn("Lỗi tải thông tin cá nhân:", err);
      }

      userLinkedRobloxIds = Array.from(foundIds);

      db.collection("roblox_logs")
        .onSnapshot(async (snapshot) => {
          rawLogsData = [];
          
          snapshot.forEach(doc => {
            const data = doc.data();
            const docDiscordId = String(data.discordId || data.details?.discordId || "");
            const rId = String(data.robloxUserId || data.details?.robloxUserId || data.robloxId || "");

            const isMatchDiscord = (docDiscordId === currentDiscordId);
            const isMatchRoblox = (isValidRobloxId(rId) && userLinkedRobloxIds.includes(rId));

            if (isMatchDiscord || isMatchRoblox) {
              rawLogsData.push({ id: doc.id, ...data });
              if (isValidRobloxId(rId) && !userLinkedRobloxIds.includes(rId)) {
                userLinkedRobloxIds.push(rId);
              }
            }
          });

          rawLogsData.sort((a, b) => {
            const timeA = a.timestamp?.seconds || a.time || 0;
            const timeB = b.timestamp?.seconds || b.time || 0;
            return timeB - timeA;
          });

          await preloadUsernames();
          updateUserFilterOptions();
          renderHistoryLogs();
          renderLiveFromLogs();
        }, (err) => {
          console.error("Lỗi kết nối Firestore Logs:", err);
        });
    }

    async function preloadUsernames() {
      const promises = userLinkedRobloxIds.map(async id => {
        const name = await fetchRobloxUsername(id);
        usernameCache[id] = name;
      });
      await Promise.all(promises);
      updateUserFilterOptions();
      renderHistoryLogs();
      renderLiveFromLogs();
    }

    function updateUserFilterOptions() {
      const filterBox = document.getElementById("filterBox");
      const userFilterSelect = document.getElementById("userFilter");

      if (userLinkedRobloxIds.length === 0) {
        filterBox.style.display = "none";
        return;
      }

      filterBox.style.display = "flex";
      const currentSelected = userFilterSelect.value;
      let optionsHtml = '<option value="ALL">✨ Tất cả tài khoản của tôi</option>';
      
      userLinkedRobloxIds.forEach(id => {
        const name = usernameCache[id] && !usernameCache[id].startsWith("ID:") ? usernameCache[id] : `ID: ${id}`;
        optionsHtml += `<option value="${id}">${name} (ID: ${id})</option>`;
      });
      userFilterSelect.innerHTML = optionsHtml;
      if (currentSelected) userFilterSelect.value = currentSelected;
    }

    function renderHistoryLogs() {
      const logsContainer = document.getElementById("logs");
      const filterSelect = document.getElementById("userFilter");
      const selectedUserId = filterSelect ? filterSelect.value : "ALL";
      logsContainer.innerHTML = "";

      if (!currentUserDiscord) {
        logsContainer.innerHTML = "<p class='empty-msg'>Vui lòng đăng nhập Discord để xem lịch sử.</p>";
        return;
      }

      const filteredLogs = rawLogsData.filter(data => {
        const userId = String(data.robloxUserId || data.details?.robloxUserId || data.robloxId || "");
        if (selectedUserId === "ALL") return userLinkedRobloxIds.includes(userId);
        return userId === selectedUserId;
      });

      if (filteredLogs.length === 0) {
        logsContainer.innerHTML = "<p class='empty-msg'>Không tìm thấy dữ liệu lịch sử nào của bạn.</p>";
        return;
      }

      filteredLogs.forEach((data) => {
        let timeStr = "Vừa xong";
        if (data.timestamp && data.timestamp.seconds) {
          timeStr = new Date(data.timestamp.seconds * 1000).toLocaleString('vi-VN');
        }

        let statusHtml = '<span class="status-badge status-other">Hoạt động</span>';
        if (data.userStatus === 1 || data.details?.userStatus === 1) {
          statusHtml = '<span class="status-badge status-1">🟢 Đã vào game</span>';
        } else if (data.userStatus === 0 || data.details?.userStatus === 0) {
          statusHtml = '<span class="status-badge status-0">🔴 Đã rời game</span>';
        }

        const userId = data.robloxUserId || data.details?.robloxUserId || data.robloxId || "Không rõ";
        const playerName = usernameCache[userId] && !usernameCache[userId].startsWith("ID:") ? usernameCache[userId] : (data.playerName || `ID: ${userId}`);
        const gameName = data.gameName || data.details?.gameName || data.lastLocation || 'Trang chủ / Website Roblox';

        const card = document.createElement("div");
        card.className = "log-card";
        card.innerHTML = `
          <div class="log-top">
            <div>Người chơi: <span class="highlight">${playerName}</span> <span class="sub-id">(ID: ${userId})</span></div>
            <div>${statusHtml}</div>
          </div>
          <div class="log-info">🎮 ${gameName}</div>
          <div class="timestamp">⏰ Thời gian: ${timeStr}</div>
        `;
        logsContainer.appendChild(card);
      });
    }

    function renderLiveFromLogs() {
      const liveContainer = document.getElementById("live-container");
      liveContainer.innerHTML = "";

      if (!currentUserDiscord) {
        liveContainer.innerHTML = "<p class='empty-msg'>Vui lòng đăng nhập bằng tài khoản Discord của bạn để xem trạng thái.</p>";
        return;
      }

      if (userLinkedRobloxIds.length === 0) {
        liveContainer.innerHTML = "<p class='empty-msg'>Tài khoản Discord của bạn chưa liên kết với tài khoản Roblox nào.</p>";
        return;
      }

      userLinkedRobloxIds.forEach(userId => {
        const userLog = rawLogsData.find(item => String(item.robloxUserId || item.details?.robloxUserId || item.robloxId) === String(userId));
        const isOnline = userLog ? (userLog.userStatus === 1 || userLog.details?.userStatus === 1) : false;
        const playerName = usernameCache[userId] && !usernameCache[userId].startsWith("ID:") ? usernameCache[userId] : `ID: ${userId}`;
        const gameName = userLog ? (userLog.gameName || userLog.details?.gameName || userLog.lastLocation || 'Trang chủ / Website Roblox') : 'Chưa ghi nhận';

        const statusBadge = isOnline 
          ? '<span class="status-badge status-1">🟢 Online / In Game</span>' 
          : '<span class="status-badge status-0">🔴 Offline</span>';

        const card = document.createElement("div");
        card.className = "log-card";
        card.innerHTML = `
          <div class="log-top">
            <div><span class="highlight">${playerName}</span></div>
            <div>${statusBadge}</div>
          </div>
          <div class="log-info">
            <p><strong>ID:</strong> ${userId}</p>
            <p><strong>Vị trí gần nhất:</strong> ${gameName}</p>
          </div>
        `;
        liveContainer.appendChild(card);
      });
    }

    checkDiscordAuth();
  </script>
</body>
</html>
