<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Logs Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 20px; }
    h1 { color: #89b4fa; margin-bottom: 20px; }
    .log-card { background: #313244; padding: 15px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid #89b4fa; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .log-header { font-weight: bold; color: #f9e2af; margin-bottom: 8px; font-size: 1.1em; }
    .log-details { background: #181825; padding: 10px 14px; border-radius: 6px; font-family: monospace; font-size: 0.9em; overflow-x: auto; border: 1px solid #45475a; }
    .log-row { margin: 4px 0; word-break: break-all; }
    .key { color: #89b4fa; font-weight: bold; }
    .value { color: #a6e3a1; }
    .timestamp { font-size: 0.85em; color: #a6adc8; margin-top: 8px; text-align: right; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>Roblox Real-time Logs</h1>
  <div id="logs">Đang kết nối Firestore...</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBYZE99y7JcqBXDQh7wHxFPdI0GVCCc_XE",
      authDomain: "roblox-logs-406cd.firebaseapp.com",
      projectId: "roblox-logs-406cd",
      storageBucket: "roblox-logs-406cd.firebasestorage.app",
      messagingSenderId: "678655678400",
      appId: "1:678655678400:web:8e99a81d2b2e23ec355a25",
      measurementId: "G-H7BS9DHD4C"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const logsContainer = document.getElementById("logs");
    
    db.collection("roblox_logs").orderBy("timestamp", "desc").limit(20)
      .onSnapshot((snapshot) => {
        logsContainer.innerHTML = "";
        if (snapshot.empty) {
          logsContainer.innerHTML = "<p>Chưa có log nào trong bộ sưu tập 'roblox_logs'.</p>";
          return;
        }
        snapshot.forEach((doc) => {
          const data = doc.data();
          const card = document.createElement("div");
          card.className = "log-card";
          
          let timeStr = "N/A";
          if (data.timestamp && data.timestamp.seconds) {
            timeStr = new Date(data.timestamp.seconds * 1000).toLocaleString('vi-VN');
          }

          // Format dữ liệu chi tiết gọn gàng, tách dòng rõ ràng
          const details = data.details || data;
          let detailsHtml = '';
          for (const [key, value] of Object.entries(details)) {
            if (value !== null && value !== undefined) {
              const displayVal = typeof value === 'object' ? JSON.stringify(value) : value;
              detailsHtml += `<div class="log-row"><span class="key">${key}:</span> <span class="value">${displayVal}</span></div>`;
            }
          }

          card.innerHTML = `
            <div class="log-header">Event: ${data.event || 'Log'}</div>
            <div class="log-details">${detailsHtml || 'Không có dữ liệu chi tiết'}</div>
            <div class="timestamp">Thời gian: ${timeStr}</div>
          `;
          logsContainer.appendChild(card);
        });
      }, (error) => {
        console.error("Lỗi lắng nghe dữ liệu:", error);
        logsContainer.innerHTML = `<p style="color: #f38ba8;">Lỗi kết nối Firestore: ${error.message}</p>`;
      });
  </script>
</body>
</html>
