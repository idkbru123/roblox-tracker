<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            background-color: #ffd300;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        .loader-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Loading Text */
        .loading-text {
            position: absolute;
            bottom: 35%;
            font-weight: bold;
            letter-spacing: 6px;
            font-size: 16px;
            color: #000;
        }

        /* Speed Lines Effect */
        .longfazers {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .longfazers span {
            position: absolute;
            height: 3px;
            width: 15%;
            background: #000;
            opacity: 0.4;
            animation: lf 0.6s linear infinite;
        }

        .longfazers span:nth-child(1) { top: 30%; animation-delay: 0s; }
        .longfazers span:nth-child(2) { top: 45%; animation-delay: 0.2s; }
        .longfazers span:nth-child(3) { top: 60%; animation-delay: 0.4s; }
        .longfazers span:nth-child(4) { top: 75%; animation-delay: 0.1s; }

        @keyframes lf {
            0% { transform: translateX(250px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(-250px); opacity: 0; }
        }

        /* Running Character Silhouette */
        .body-anim {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: speeder 0.4s linear infinite;
        }

        @keyframes speeder {
            0% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-6px); }
            100% { transform: translate(-50%, -50%) translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="longfazers">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="body-anim">
            <!-- Sleek runner graphic -->
            <svg width="90" height="45" viewBox="0 0 100 50" fill="#000">
                <path d="M42,12 C52,7 62,17 72,12 C77,10 82,17 77,22 C67,27 52,22 42,32 C37,37 32,47 22,42 C17,37 27,27 32,22 C22,27 12,22 7,17 C12,12 22,17 32,12 C37,10 40,14 42,12 Z"/>
            </svg>
        </div>
        <div class="loading-text">L O A D I N G . . .</div>
    </div>
</body>
</html>
