<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Tracker - eDEX-UI Intro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Courier New', Courier, monospace; 
      background-color: #050505; 
      color: #ffffff; 
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ------------------------------------
       MÀN HÌNH INTRO EDE-X UI (GIỐNG VIDEO)
    ------------------------------------ */
    #e-intro {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      background: #000000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px;
      overflow: hidden;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Khu vực log chạy chữ phía trên */
    .terminal-screen {
      width: 100%;
      max-width: 700px;
      height: 45vh;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.4;
      overflow: hidden;
      white-space: pre-wrap;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.2);
    }

    /* Khung cửa sổ trung tâm phóng to (Scale Up) */
    .edex-window {
      position: relative;
      width: 380px;
      height: 140px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(10, 10, 10, 0.9);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      transform: scale(0);
      opacity: 0;
      animation: edexZoomIn 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.5s; /* Chờ log chạy trước một nhịp */
    }

    @keyframes edexZoomIn {
      0% {
        transform: scale(0.05);
        opacity: 0;
      }
      60% {
        transform: scale(1.05);
        opacity: 0.9;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .edex-content {
      text-align: center;
    }

    .edex-title {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ffffff;
      margin-bottom: 6px;
      text-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    .edex-sub {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 0.85rem;
      color: #888888;
    }

    /* Mô phỏng ánh sáng bàn phím phát sáng bên dưới như trong video */
    .keyboard-glow-area {
      width: 100%;
      max-width: 500px;
      height: 80px;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 70%);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      animation: fadeInKb 1s ease forwards;
      animation-delay: 0.5s;
    }

    @keyframes fadeInKb {
      to { opacity: 1; }
    }

    .kb-simulation {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    /* Hiệu ứng kết thúc Intro: Phóng to ẩn đi và mượt mà hiện UI chính */
    #e-intro.fade-out {
      opacity: 0;
      transform: scale(1.15);
      pointer-events: none;
    }

    /* ------------------------------------
       GIAO DIỆN CHÍNH (UI) SAU KHI INTRO XONG
    ------------------------------------ */
    .main-app {
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    .main-app.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    h1 { color: #f3f4f6; margin-bottom: 12px; font-size: 1.8rem; }
    p { color: #9ca3af; font-family: 'Segoe UI', Tahoma, sans-serif; }
  </style>
</head>
<body>

  <!-- KHU VỰC INTRO ANIMATION (MÔ PHỎNG E-DEX UI) -->
  <div id="e-intro">
    <!-- Phần dòng lệnh chạy phía trên -->
    <div class="terminal-screen" id="terminalLogs"></div>

    <!-- Khung cửa sổ trung tâm phóng to -->
    <div class="edex-window">
      <div class="edex-content">
        <div class="edex-title">eDEX-UI // ROBLOX TRACKER</div>
        <div class="edex-sub" id="welcomeText">Welcome back, operator</div>
      </div>
    </div>

    <!-- Phần bàn phím phát sáng phía dưới -->
    <div class="keyboard-glow-area">
      <div class="kb-simulation">ctrl  alt  command  space  command  option</div>
    </div>
  </div>

  <!-- GIAO DIỆN CHÍNH CỦA ỨNG DỤNG -->
  <div class="main-app" id="mainApp">
    <h1>🎮 Roblox Tracker Dashboard</h1>
    <p>Hệ thống giám sát đã khởi tạo thành công qua giao diện Terminal bảo mật.</p>
  </div>

  <script>
    // 1. Hiệu ứng chạy dòng lệnh terminal liên tục giống hệt video
    const terminalLogs = document.getElementById('terminalLogs');
    const logs = [
      "Initializing eDEX-UI kernel v2.4.1...",
      "Loading configuration files from /etc/edex/...",
      "Mounting virtual file system...",
      "Establishing secure WebSocket connection to Firebase...",
      "Bypassing network firewalls [OK]",
      "Loading Roblox API telemetry endpoints...",
      "Decrypting user session tokens...",
      "Memory allocation: 128MB stable.",
      "Neural interface synced. Ready for execution."
    ];

    let index = 0;
    function printLogs() {
      if (index < logs.length) {
        terminalLogs.innerHTML += "> " + logs[index] + "<br>";
        terminalLogs.scrollTop = terminalLogs.scrollHeight;
        index++;
        setTimeout(printLogs, 220); // Tốc độ chạy từng dòng lệnh
      }
    }
    printLogs();

    // 2. Tự động tắt Intro, phóng to ẩn đi và kích hoạt giao diện chính mượt mà sau 4.8 giây
    setTimeout(() => {
      const intro = document.getElementById('e-intro');
      const mainApp = document.getElementById('mainApp');

      intro.classList.add('fade-out');
      mainApp.classList.add('loaded');

      // Gỡ bỏ hoàn toàn khỏi DOM sau khi animation hoàn tất để giải phóng RAM
      setTimeout(() => {
        intro.style.display = 'none';
      }, 1000);

    }, 4800);
  </script>
</body>
</html>
