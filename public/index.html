<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Activity History</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 20px; max-width: 900px; margin-left: auto; margin-right: auto; }
    h1 { color: #89b4fa; text-align: center; margin-bottom: 25px; }
    .log-card { background: #313244; padding: 15px 20px; margin-bottom: 12px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 8px; }
    .log-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #45475a; padding-bottom: 8px; }
    .status-badge { padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.9em; }
    .status-1 { background: #a6e3a1; color: #11111b; } /* Vào game */
    .status-0 { background: #f38ba8; color: #11111b; } /* Rời game */
    .status-other { background: #89b4fa; color: #11111b; } /* Khác */
    .log-info { font-size: 0.95em; color: #bac2de; }
    .highlight { color: #f9e2af; font-weight: bold; }
    .timestamp { font-size: 0.85em; color: #a6adc8; text-align: right; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>📜 Lịch Sử Hoạt Động Roblox</h1>
  <div id="logs">Đang kết nối dữ liệu lịch sử...</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBYZE99y7JcqBXDQh7wHxFPdI0GVCCc_XE",
      authDomain: "roblox-logs-406cd.firebaseapp.com",
      projectId: "roblox-logs-406cd",
      storageBucket: "roblox-logs-406cd.firebasestorage.app",
      messagingSenderId: "678655678400",
      appId: "1:678655678400:web:8e99a81d2b2e23ec355a25",
      measurementId: "G-H7BS9DHD4C"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const logsContainer = document.getElementById("logs");
    
    db.collection("roblox_logs").orderBy("timestamp", "desc").limit(20)
      .onSnapshot((snapshot) => {
        logsContainer.innerHTML = "";
        if (snapshot.empty) {
          logsContainer.innerHTML = "<p style='text-align:center;'>Chưa có lịch sử hoạt động nào được ghi nhận.</p>";
          return;
        }

        snapshot.forEach((doc) => {
          const data = doc.data();
          
          // Xử lý thời gian
          let timeStr = "Vừa xong";
          if (data.timestamp && data.timestamp.seconds) {
            timeStr = new Date(data.timestamp.seconds * 1000).toLocaleString('vi-VN');
          }

          // Dịch mã trạng thái userStatus sang tiếng Việt dễ hiểu
          let statusHtml = '<span class="status-badge status-other">Hoạt động</span>';
          if (data.userStatus === 1 || data.details?.userStatus === 1) {
            statusHtml = '<span class="status-badge status-1">🟢 Đã vào game</span>';
          } else if (data.userStatus === 0 || data.details?.userStatus === 0) {
            statusHtml = '<span class="status-badge status-0">🔴 Đã rời game</span>';
          }

          const userId = data.robloxUserId || data.details?.robloxUserId || "Không rõ";
          const location = data.lastLocation || data.details?.lastLocation || "Khu vực chính";

          const card = document.createElement("div");
          card.className = "log-card";
          card.innerHTML = `
            <div class="log-top">
              <div>ID Người chơi: <span class="highlight">${userId}</span></div>
              <div>${statusHtml}</div>
            </div>
            <div class="log-info">
              📍 Vị trí/Map: <span style="color: #a6e3a1;">${location}</span>
            </div>
            <div class="timestamp">⏰ Thời gian: ${timeStr}</div>
          `;
          logsContainer.appendChild(card);
        });
      }, (error) => {
        console.error("Lỗi:", error);
        logsContainer.innerHTML = `<p style="color: #f38ba8; text-align:center;">Lỗi kết nối: ${error.message}</p>`;
      });
  </script>
</body>
</html>
